<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Document body with folded top-right corner -->
  <polygon points="18,6 64,6 82,24 82,94 18,94" fill="white"/>
  <!-- Fold flap (back of folded corner) -->
  <polygon points="64,6 82,24 64,24" fill="#c5d8ef"/>
  <!-- Fold crease line -->
  <line x1="64" y1="6" x2="82" y2="24" stroke="#a8c0e0" stroke-width="1.5"/>
  <!-- Text lines -->
  <rect x="28" y="34" width="37" height="7" rx="2" fill="#94c4e6"/>
  <rect x="28" y="47" width="37" height="7" rx="2" fill="#94c4e6"/>
  <rect x="28" y="60" width="37" height="7" rx="2" fill="#94c4e6"/>
  <rect x="28" y="73" width="22" height="7" rx="2" fill="#94c4e6"/>
</svg>
